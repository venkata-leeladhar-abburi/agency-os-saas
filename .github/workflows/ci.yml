name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Database tests (RLS, cross-tenant, invitations) run against a real Postgres.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, unit tests, token and contrast check, design rules, format
        run: pnpm check
      - run: pnpm build
      - name: Build Storybook
        run: pnpm --filter @agency-os/ui build-storybook
      - run: pnpm --filter @agency-os/web exec playwright install --with-deps chromium
      - name: App e2e smoke and axe
        run: pnpm --filter @agency-os/web e2e
      - name: Storybook stories axe, light and dark
        run: pnpm --filter @agency-os/ui test:stories
      - name: Prototype screenshot set (every screen, light and dark, 390px and 1440px)
        run: SCREENSHOTS=1 pnpm --filter @agency-os/web exec playwright test e2e/screenshots.spec.ts
      - name: Upload prototype screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-screenshots
          path: apps/web/prototype-screenshots
          retention-days: 30
      - name: Upload Storybook and story screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: |
            packages/ui/storybook-static
            packages/ui/test-results
          retention-days: 14
